spring:
  application:
    name: ms-andesstay-bff
  # El BFF es una app servlet clasica; se fuerza explicitamente porque spring-webflux
  # esta en el classpath solo para poder usar WebClient como cliente HTTP.
  main:
    web-application-type: servlet

  security:
    oauth2:
      resourceserver:
        jwt:
          # --- Seguridad: AWS Cognito (mismo User Pool que catalog, audit y el resto) ---
          # Reemplazar {region} y {userPoolId} por los del User Pool real via variables de entorno.
          issuer-uri: https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}

server:
  port: ${SERVER_PORT:8080}

# --- Configuracion propia del BFF (IDaaS + microservicios de dominio) ---
cognito:
  # App Client ID del User Pool. Los access tokens de Cognito no traen "aud", traen
  # "client_id"; debe coincidir con el App Client con el que el frontend hace login.
  app-client-id: ${COGNITO_APP_CLIENT_ID:CHANGE_ME}

andesstay:
  services:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
    audit:
      base-url: ${AUDIT_SERVICE_URL:http://localhost:8083}

cors:
  # Origen del frontend Angular (login con Cognito y llamadas al BFF desde aqui).
  allowed-origins: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO
    cl.duoc.andesstay.bff: DEBUG

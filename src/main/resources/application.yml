spring:
  application:
    name: ms-andesstay-bff
  # El BFF es una app servlet clasica; se fuerza explicitamente porque spring-webflux
  # esta en el classpath solo para poder usar WebClient como cliente HTTP.
  main:
    web-application-type: servlet

  security:
    oauth2:
      resourceserver:
        jwt:
          # Documento de descubrimiento OIDC de Azure AD (v2.0). Reemplazar {tenant-id}
          # por el Directory (tenant) ID de la app registrada en Azure AD.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:CHANGE_ME-tenant-id}/v2.0

server:
  port: ${SERVER_PORT:8080}

# --- Configuracion propia del BFF (IDaaS + microservicios de dominio) ---
azure:
  ad:
    # Application (client) ID de la API expuesta por el BFF en Azure AD.
    # Debe coincidir con el "aud" (audience) del JWT emitido para esta API.
    audience: ${AZURE_API_CLIENT_ID:CHANGE_ME-audience}

andesstay:
  services:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}

cors:
  # Origen del frontend Angular (MSAL redirige y llama al BFF desde aqui).
  allowed-origins: ${FRONTEND_URL:http://localhost:4200}

logging:
  level:
    org.springframework.security: INFO
    cl.duoc.andesstay.bff: DEBUG
